    <script>
      (function () {
        "use strict";
        // After deploying the accompanying Google Apps Script, paste its Web App URL here.
        const API_URL =
          "https://script.google.com/macros/s/AKfycbyeFa6f0Mkq1qcl2gFuBmzrUlkcZtARj9wqEuBmR5_wdVAWvkVOtOMEGoFOFqS4Mss1/exec";
        const ALLOWED_FILES = new Set([
          "BCS_Angikarnama.docx",
          "BCS_Angikarnama.pdf",
          "Sompod_Bibaroni.docx",
          "Personnel_Data_Sheet.docx",
        ]);
        const totalEl = document.getElementById("downloadTotal");
        function configured() {
          return (
            API_URL.startsWith("https://script.google.com/macros/s/") &&
            API_URL.endsWith("/exec")
          );
        }
        function showTotal(value) {
          if (!Number.isFinite(Number(value))) return;
          if (totalEl) totalEl.textContent = Number(value).toLocaleString("en-US");
        }
        async function fetchTotal() {
          if (!configured()) return;
          try {
            const res = await fetch(API_URL + "?action=read&t=" + Date.now(), {
              method: "GET",
              cache: "no-store",
            });
            if (!res.ok) throw new Error("Counter API request failed");
            const data = await res.json();
            if (data && data.ok) showTotal(data.totalDownloads);
          } catch (e) {
            console.warn("Shared download counter could not be loaded.", e);
          }
        }
        window.bcs45TrackDownload = function (filename) {
          const name = String(filename || "");
          if (!ALLOWED_FILES.has(name) || !configured()) return;
          // Fire-and-forget: the document download should not wait for the counter API.
          fetch(
            API_URL +
              "?action=increment&file=" +
              encodeURIComponent(name) +
              "&t=" +
              Date.now(),
            { method: "GET", cache: "no-store" },
          )
            .then((r) => {
              if (!r.ok) throw new Error("Counter increment failed");
              return r.json();
            })
            .then((data) => {
              if (data && data.ok) showTotal(data.totalDownloads);
              else fetchTotal();
            })
            .catch((e) => {
              console.warn("Download count could not be updated.", e);
            });
        };
        fetchTotal();
      })();
    </script>

    <script>
      (function () {
        const modal = document.getElementById("developerModal");
        const openBtn = document.getElementById("openDeveloper");
        const closeBtn = document.getElementById("closeDeveloper");
        if (!modal || !openBtn || !closeBtn) return;
        let previousFocus = null;
        function openModal() {
          previousFocus = document.activeElement;
          modal.classList.add("is-open");
          modal.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }
        function closeModal() {
          modal.classList.remove("is-open");
          modal.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
          if (previousFocus) previousFocus.focus();
        }
        openBtn.addEventListener("click", openModal);
        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });
        const facebookLink = document.getElementById("developerFacebook");
        const developer = window.BCS_DEVELOPER || {};
        const setText = (id, value) => { const element = document.getElementById(id); if (element && value) element.textContent = value; };
        setText("developerName", developer.name);
        setText("developerSubtitle", developer.subtitle);
        setText("developerWorkplace", developer.workplace);
        setText("developerBcs46", developer.bcs46);
        setText("developerBcs47", developer.bcs47);
        const developerImage = document.querySelector(".developer-photo");
        if (developerImage && developer.image) developerImage.src = developer.image;
        const facebookUrl = developer.facebook_url;
        if (facebookLink && facebookUrl) { facebookLink.href = facebookUrl; facebookLink.hidden = false; }
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && modal.classList.contains("is-open"))
            closeModal();
        });
        if (new URLSearchParams(window.location.search).get("developer") === "1") {
          window.setTimeout(openModal, 120);
        }
      })();
    </script>
